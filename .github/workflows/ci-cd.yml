name: CI/CD

# Runs on push to main only. A self-hosted runner must never be reachable
# from a fork pull request on a public repository, so pull_request and
# pull_request_target triggers are deliberately absent.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "tailwind.config.mts"
      - "postcss.config.js"
      - "Dockerfile"
      - ".dockerignore"
      - "sonar-project.properties"
      # Only this workflow, not .github/workflows/**: editing another workflow
      # must not rebuild and redeploy the frontend image.
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify
    # Pinned rather than ubuntu-latest: the float moves on GitHub's schedule.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs: a mutable major tag can be
      # re-pointed at new code. The comment keeps the readable version.
      # The scanner needs history to attribute issues to the right commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=false

  image:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tag
        id: meta
        run: echo "tag=${REGISTRY}/${IMAGE_NAME,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to public EC2
    needs: image
    runs-on: [self-hosted, public_ec2-runner]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart
        env:
          SHUTTLEVN_FRONTEND_IMAGE: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          cd /opt/shuttlevn/frontend
          echo "$(date -Is) deploying ${SHUTTLEVN_FRONTEND_IMAGE}" >> deploy.log
          echo "SHUTTLEVN_FRONTEND_IMAGE=${SHUTTLEVN_FRONTEND_IMAGE}" > .env
          docker pull "$SHUTTLEVN_FRONTEND_IMAGE"
          SHUTTLEVN_FRONTEND_IMAGE="$SHUTTLEVN_FRONTEND_IMAGE" docker compose up -d --remove-orphans

      - name: Health check
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::frontend did not become healthy within 150s"
          cd /opt/shuttlevn/frontend
          docker compose logs --tail 100 frontend >> deploy.log
          exit 1

      - name: Record deployed tag
        if: always()
        run: |
          cd /opt/shuttlevn/frontend
          docker inspect shuttlevn-frontend --format '{{.Config.Image}}' >> deploy.log || true
